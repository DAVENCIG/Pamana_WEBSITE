    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/brand/pamana-favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7F1E6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="PAMANA · Alamin. Aralin. Tandaan." />
    <meta property="og:description" content="Mga aralin at pagsusulit sa Araling Panlipunan para sa Baitang 7 hanggang 10. Gumagana kahit offline." />
    <script>
      // Apply theme and text size before first paint to avoid a flash (mirrors src/lib/preferences.ts).
      try {
        var p = JSON.parse(localStorage.getItem("pamana-prefs") || "{}")
        var t = p.theme || "system"
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
        document.documentElement.dataset.textSize = p.textSize || "normal"
        if (p.reduceMotion) document.documentElement.dataset.motion = "reduce"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
