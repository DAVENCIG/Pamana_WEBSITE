<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <script>
      // Apply theme and text size before first paint to avoid a flash (mirrors src/lib/preferences.ts).
      try {
        var p = JSON.parse(localStorage.getItem("pamana-prefs") || "{}")
        var t = p.theme || "system"
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
        document.documentElement.dataset.textSize = p.textSize || "normal"
        if (p.reduceMotion) document.documentElement.dataset.motion = "reduce"
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
